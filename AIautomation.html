<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AZAD AI STUDIO - Personal Auto</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap');

        :root {
            --bg-color: #e8ecf1;
            --clay-bg: #f0f4f8;
            --primary: #5c8df6;
            --text-dark: #2d3748;
            --text-light: #718096;
            --success: #48bb78;
            --warning: #ecc94b;
            --danger: #f56565;
            
            --out-shadow: 9px 9px 16px rgba(163, 177, 198, 0.6), -9px -9px 16px rgba(255, 255, 255, 0.8);
            --in-shadow: inset 6px 6px 12px rgba(163, 177, 198, 0.5), inset -6px -6px 12px rgba(255, 255, 255, 0.9);
            --card-radius: 24px;
            --btn-radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-dark); height: 100vh; display: flex; flex-direction: column; }

        header { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-color); }
        .header-title { font-size: 1.4rem; font-weight: 800; color: var(--primary); letter-spacing: 1px; }

        main { flex: 1; overflow-y: auto; padding: 16px 24px 40px 24px; }

        .clay-card {
            background: var(--clay-bg);
            border-radius: var(--card-radius);
            box-shadow: var(--out-shadow);
            padding: 24px;
            margin-bottom: 28px;
        }

        .clay-input {
            width: 100%; background: var(--bg-color); border: none; border-radius: var(--btn-radius);
            box-shadow: var(--in-shadow); padding: 16px; font-size: 1rem; color: var(--text-dark);
            margin-bottom: 20px; outline: none;
        }

        .clay-btn {
            background: var(--primary); border: none; border-radius: var(--btn-radius);
            box-shadow: 6px 6px 12px rgba(92, 141, 246, 0.4), -6px -6px 12px rgba(255, 255, 255, 1);
            padding: 16px 24px; color: white; font-weight: 800; font-size: 1.1rem;
            cursor: pointer; width: 100%; transition: all 0.2s ease; margin-bottom: 12px;
        }
        .clay-btn:active { box-shadow: inset 4px 4px 8px rgba(0,0,0,0.2); transform: scale(0.98); }
        .clay-btn.secondary { background: var(--clay-bg); color: var(--primary); box-shadow: var(--out-shadow); }
        .clay-btn.secondary:active { box-shadow: var(--in-shadow); }
        .clay-btn.danger { background: var(--danger); box-shadow: 6px 6px 12px rgba(245, 101, 101, 0.4), -6px -6px 12px rgba(255, 255, 255, 1); }
        .clay-btn:disabled { background: var(--text-light); box-shadow: none; cursor: not-allowed; }

        .badge { font-size: 0.75rem; padding: 6px 12px; border-radius: 12px; font-weight: 800; text-transform: uppercase; background: #e6fffa; color: var(--success); }
        
        .auth-status { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 0.9rem; font-weight: bold; color: var(--danger); }
        .auth-status.connected { color: var(--success); }

        #log-console {
            background: #1a202c; color: #a0aec0; border-radius: 16px; padding: 16px;
            font-family: monospace; font-size: 0.8rem; height: 200px; overflow-y: auto; box-shadow: var(--out-shadow);
        }
        .log-success { color: #48bb78; } .log-error { color: #f56565; } .log-info { color: #63b3ed; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">AZAD AI STUDIO</div>
    </header>

    <main>
        <!-- AUTHENTICATION SECTION -->
        <div class="clay-card">
            <h3 style="margin-bottom: 16px;">1. Admin Access</h3>
            <p style="font-size: 0.8rem; color: var(--text-light); margin-bottom: 10px;">Authorized Account: amritprabhakar5@gmail.com</p>
            
            <div id="auth-indicator" class="auth-status">🔴 Disconnected</div>
            
            <button id="btn-login" class="clay-btn secondary">Login with Google</button>
            <button id="btn-logout" class="clay-btn danger" style="display: none;">Logout</button>
        </div>

        <!-- AUTOMATION CONFIG SECTION -->
        <div class="clay-card">
            <h3 style="margin-bottom: 16px; color: var(--primary);">2. Channel Setup</h3>
            <label style="font-size: 0.9rem; font-weight: bold; margin-left: 10px;">Channel Niche</label>
            <input type="text" id="niche-input" class="clay-input" placeholder="e.g., Mystery, Sci-Fi, Facts">
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 0 10px;">
                <strong>Video Style:</strong> <span class="badge">Cartoon + Docu</span>
            </div>
            <button id="btn-save-config" class="clay-btn secondary">Save Database</button>
        </div>

        <!-- EXECUTION SECTION -->
        <div class="clay-card">
            <h3 style="margin-bottom: 16px;">3. Generate & Upload</h3>
            <button id="start-btn" class="clay-btn" disabled>Generate & Upload Video Now</button>
        </div>

        <!-- LOGS -->
        <div class="clay-card">
            <h3 style="margin-bottom: 16px;">Live System Logs</h3>
            <div id="log-console">System Ready. Please Login...<br></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // USING REDIRECT FOR 100% MOBILE COMPATIBILITY
        import { getAuth, signInWithRedirect, getRedirectResult, signOut, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfigAzad = {
            apiKey: "AIzaSyDyeQAYlc2h7vX8Z_9FZn4MquIKshwWWyk",
            authDomain: "azad-skill.firebaseapp.com",
            projectId: "azad-skill",
            storageBucket: "azad-skill.firebasestorage.app",
            messagingSenderId: "465099025771",
            appId: "1:465099025771:web:7dec7d1c2b763df7a6302e"
        };

        const API_KEYS = {
            GEMINI: 'AQ.Ab8RN6JfVmyaRvLVmGfPW9X_k_uUGiWhf_Uf7xQP2WC8bQ2qcg',
            SEEDANCE: 'key_0a9d0806a2c26062ff77d60cd1876d88663717e6e624655a5fa175849eeec8354997232ea7a5337b754948c4259187842ec8a8ce88251f79e044fb3bb6208cd5'
        };

        const app = initializeApp(firebaseConfigAzad);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const provider = new GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/youtube.upload');
        provider.setCustomParameters({ prompt: 'select_account' }); // Forces account selection

        let youtubeAccessToken = null;
        let currentUser = null;

        const logger = document.getElementById('log-console');
        function logMsg(msg, type='info') {
            const time = new Date().toLocaleTimeString();
            logger.innerHTML += `<span class="log-${type}">[${time}] ${msg}</span><br>`;
            logger.scrollTop = logger.scrollHeight;
        }

        // ==========================================
        // AUTHENTICATION (REDIRECT METHOD)
        // ==========================================
        
        // This catches the user when they return from the Google Login page
        getRedirectResult(auth).then((result) => {
            if (result) {
                const credential = GoogleAuthProvider.credentialFromResult(result);
                youtubeAccessToken = credential.accessToken;
                currentUser = result.user;
                
                // Security Check (Optional UI warning)
                if(currentUser.email !== "amritprabhakar5@gmail.com") {
                    logMsg(`WARNING: Logged in as ${currentUser.email}. YouTube API might block upload.`, "error");
                }
                
                updateAuthUI(true, currentUser.email);
                logMsg(`Login Success! Access Token Acquired.`, "success");
                loadUserConfig();
            }
        }).catch((error) => {
            logMsg(`Login Error: ${error.message}`, "error");
        });

        // Login Button Click
        document.getElementById('btn-login').addEventListener('click', () => {
            logMsg("Redirecting to Google Login...", "info");
            signInWithRedirect(auth, provider);
        });

        // Logout Button Click
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                youtubeAccessToken = null;
                currentUser = null;
                updateAuthUI(false);
                logMsg("Logged out successfully.", "info");
            });
        });

        function updateAuthUI(isConnected, email = "") {
            const indicator = document.getElementById('auth-indicator');
            const startBtn = document.getElementById('start-btn');
            const btnLogin = document.getElementById('btn-login');
            const btnLogout = document.getElementById('btn-logout');

            if(isConnected) {
                indicator.innerHTML = `🟢 Connected: ${email}`;
                indicator.className = 'auth-status connected';
                startBtn.disabled = false;
                btnLogin.style.display = 'none';
                btnLogout.style.display = 'block';
            } else {
                indicator.innerHTML = `🔴 Disconnected`;
                indicator.className = 'auth-status';
                startBtn.disabled = true;
                btnLogin.style.display = 'block';
                btnLogout.style.display = 'none';
            }
        }

        // ==========================================
        // FIREBASE DATABASE
        // ==========================================
        document.getElementById('btn-save-config').addEventListener('click', async () => {
            if(!currentUser) return alert("Please login first!");
            const niche = document.getElementById('niche-input').value.trim();
            if(!niche) return alert("Enter a Niche first!");
            
            try {
                await setDoc(doc(db, "automations", currentUser.uid), { niche: niche, updatedAt: new Date() });
                logMsg("Config saved successfully!", "success");
            } catch(e) { logMsg(`Save Error: ${e.message}`, "error"); }
        });

        async function loadUserConfig() {
            if(!currentUser) return;
            const docSnap = await getDoc(doc(db, "automations", currentUser.uid));
            if(docSnap.exists()) {
                document.getElementById('niche-input').value = docSnap.data().niche;
            }
        }

        // ==========================================
        // AUTOMATION WORKFLOW
        // ==========================================
        document.getElementById('start-btn').addEventListener('click', async () => {
            const niche = document.getElementById('niche-input').value.trim();
            if(!niche || !youtubeAccessToken) return alert("Please setup Niche and ensure you are logged in.");

            const btn = document.getElementById('start-btn');
            btn.disabled = true; btn.innerText = "Processing Workflow...";
            logMsg(`--- STARTING AUTOMATION FOR: ${niche.toUpperCase()} ---`, "info");

            try {
                const aiData = await generateGeminiContent(niche);
                const videoUrl = await generateRunwayVideo(aiData.video_prompt);
                await uploadToYouTube(aiData, videoUrl); // REAL UPLOAD CALLED HERE

                logMsg("--- BATCH COMPLETE ---", "success");
                btn.innerText = "Generate & Upload Video Now";
                btn.disabled = false;
            } catch (error) {
                logMsg(`Workflow Failed: ${error.message}`, "error");
                btn.innerText = "Generate & Upload Video Now";
                btn.disabled = false;
            }
        });

        // ==========================================
        // 1. GEMINI API
        // ==========================================
        async function generateGeminiContent(niche) {
            logMsg("1. Gemini: Generating script...", "info");
            const promptInstruction = `You are a viral YouTube Shorts automation AI. Niche: "${niche}".
            TASK 1: Think of a trending sub-topic. TASK 2: Write a 30-second script. TASK 3: Write a detailed visual prompt for an AI Video Generator.
            STRICT STYLE: "Cartoon + Documentary".
            Return ONLY JSON: {"title": "String", "hook": "String", "script": "String", "video_prompt": "String"}`;

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${API_KEYS.GEMINI}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: promptInstruction }] }] })
            });
            if(!response.ok) throw new Error("Gemini API failed");

            let data = await response.json();
            let rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
            logMsg("Gemini JSON Parsed.", "success");
            return JSON.parse(rawText);
        }

        // ==========================================
        // 2. RUNWAY API
        // ==========================================
        async function generateRunwayVideo(videoPrompt) {
            logMsg("2. Seedance: Rendering video...", "info");
            try {
                const response = await fetch('https://api.runwayml.com/v1/tasks', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${API_KEYS.SEEDANCE}`, 'Content-Type': 'application/json', 'X-Runway-Version': '2023-09-06' },
                    body: JSON.stringify({ taskType: "text-to-video", model: "seedance2_5", options: { promptText: videoPrompt, ratio: "1080:1920", duration: 29 } })
                });

                if(!response.ok) throw new Error("Runway blocked");
                logMsg("Video generation task started.", "success");
                
                // Return demo URL for workflow testing
                return "https://www.w3schools.com/html/mov_bbb.mp4"; 
            } catch (err) {
                logMsg(`Seedance Error. Using fallback test MP4.`, "warn");
                return "https://www.w3schools.com/html/mov_bbb.mp4"; 
            }
        }

        // ==========================================
        // 3. YOUTUBE UPLOAD (REAL MULTIPART)
        // ==========================================
        async function uploadToYouTube(aiData, videoUrl) {
            logMsg("3. YouTube: Fetching MP4 and Uploading...", "info");
            if(!youtubeAccessToken) throw new Error("Missing YouTube Access Token");

            try {
                logMsg("Downloading MP4 file...", "info");
                const videoResponse = await fetch(videoUrl);
                const videoBlob = await videoResponse.blob();

                const metadata = {
                    snippet: {
                        title: aiData.title,
                        description: `${aiData.hook}\n\n${aiData.script}\n\n#shorts #cartoon #documentary`,
                        tags: ['shorts', 'cartoon', 'documentary', 'automation']
                    },
                    status: { privacyStatus: 'private' } // Test ke liye private
                };

                const form = new FormData();
                form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
                form.append('file', videoBlob, 'shorts.mp4');

                logMsg("Uploading Multipart Data to Channel...", "info");
                const uploadResponse = await fetch('https://www.googleapis.com/upload/youtube/v3/videos?uploadType=multipart&part=snippet,status', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${youtubeAccessToken}` },
                    body: form
                });

                const result = await uploadResponse.json();
                if(result.error) {
                    logMsg(`YouTube API Error: ${result.error.message}`, "error");
                } else {
                    logMsg(`Success! Video Uploaded. YT ID: ${result.id}`, "success");
                }
            } catch(err) {
                logMsg(`YouTube Upload Failed: ${err.message}`, "error");
            }
        }
    </script>
</body>
</html>
